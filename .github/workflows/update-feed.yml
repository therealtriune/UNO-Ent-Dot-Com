name: Update UNO Entertainment Feed

# Runs on a schedule to pull fresh articles and rebuild the site, and can
# also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes. GitHub may delay this a bit
                              # under load — schedules aren't to-the-second.
  workflow_dispatch: {}

# Needed so the workflow can push the updated files back to the repo.
permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
        timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest articles
        run: python3 fetch_feeds.py

      - name: Retry any missing thumbnails
        run: python3 fix_missing_thumbnails.py

      - name: Rebuild site
        run: python3 build_site.py

      - name: Commit and push if changed
        run: |
          git config user.name "uno-ent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articles.json thumbnail_flags.json index.html style.css articles/ page/ category/ privacy-policy/ terms/
          if git diff --cached --quiet; then
            echo "No new articles — nothing to commit."
          else
            git commit -m "Auto-update: refresh articles $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
